name: Publish SnowRunner mod to mod.io

on:
  push:
    branches: [main]
    paths:
      - "awd-add/**"
  workflow_dispatch:
    inputs:
      version:
        description: "mod.io file version (for example 1.2.3)"
        required: true
        type: string
      changelog:
        description: "Release notes for the mod.io upload"
        required: false
        default: "Published from GitHub Actions"
        type: string

permissions:
  contents: read

env:
  MODIO_GAME_ID: "3060"
  MODIO_MOD_ID: ${{ secrets.MODIO_MOD_ID }}

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${{ secrets.MODIO_ACCESS_TOKEN }}" ]] || {
            echo "Missing secret: MODIO_ACCESS_TOKEN" >&2
            exit 1
          }
          [[ -n "${{ secrets.MODIO_MOD_ID }}" ]] || {
            echo "Missing secret: MODIO_MOD_ID (must be the numeric mod ID, not the slug awd-add)" >&2
            exit 1
          }

      - name: Resolve release version
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${INPUT_VERSION}"
          else
            version="0.0.0-${GIT_SHA:0:7}"
          fi

          # Keep it simple and valid for mod.io
          [[ "$version" =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo "Invalid version: $version" >&2
            exit 1
          }

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build ZIP package
        shell: bash
        run: |
          set -euo pipefail

          # Change this folder to the actual folder for awd-add in your repo
          # Example: if your mod lives in "awd-add/", leave it as-is.
          if [[ ! -d "awd-add" ]]; then
            echo "Expected folder 'awd-add/' was not found in the repo." >&2
            echo "Update this workflow to the real mod folder path." >&2
            exit 1
          fi

          cd awd-add
          zip -r ../awd-add.zip .
          test -s ../awd-add.zip

      - name: Upload mod file to mod.io
        shell: bash
        env:
          MODIO_TOKEN: ${{ secrets.MODIO_ACCESS_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          CHANGELOG: ${{ github.event_name == 'workflow_dispatch' && inputs.changelog || format('Published from commit {0}', github.sha) }}
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --retry 3 \
            --request POST \
            --url "https://g-${MODIO_GAME_ID}.modapi.io/v1/games/${MODIO_GAME_ID}/mods/${MODIO_MOD_ID}/files" \
            --header "Authorization: Bearer ${MODIO_TOKEN}" \
            --form "filedata=@awd-add.zip;type=application/zip" \
            --form "version=${VERSION}" \
            --form "changelog=${CHANGELOG}" \
            --form "active=true"
